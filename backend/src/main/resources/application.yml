spring:
  application:
    name: harness-system-api
  datasource:
    url: ${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5432/harness_system}
    username: ${APP_DATASOURCE_USERNAME:harness}
    password: ${APP_DATASOURCE_PASSWORD:harness}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
